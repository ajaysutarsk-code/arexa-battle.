<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AREXA ADMIN</title>
<style>:root{--p:#b026ff}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:420px;margin:0 auto;padding:20px}h1{color:var(--p);text-shadow:0 0 12px var(--p);margin:8px 0 0;font-size:30px;font-weight:900}.tag{font-size:11px;letter-spacing:1px;margin-bottom:20px}.card{background:#111;border:1px solid var(--p);border-radius:10px;padding:16px;margin:12px 0}input{width:100%;padding:11px;margin:6px 0;background:#000;color:#fff;border:1px solid #444;border-radius:6px}button{width:100%;padding:12px;margin:6px 0;background:var(--p);color:#fff;border:0;border-radius:6px;font-weight:700}button.ghost{background:transparent;border:1px solid var(--p)}.err{color:#ff5470;font-size:13px}.big{font-size:26px;color:var(--p);font-weight:800}.off{opacity:.45}</style></head><body><div class="wrap" id="app"><h1>AREXA</h1>Loading...</div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script><script>
window.onerror=function(m){document.getElementById('app').innerHTML='<div class="card err">Error: '+m+'<br><br>Ye file https:// link se kholo (GitHub Pages / Firebase Hosting). Phone ke file manager se nahi chalegi.</div>'};
const $=document.getElementById('app');let err='';
firebase.initializeApp({apiKey:"AIzaSyA-Y_Y8R8XCrYNRShlD0YnP0CLkVmN93VY",authDomain:"arexa-battle-26e5f.firebaseapp.com",projectId:"arexa-battle-26e5f",storageBucket:"arexa-battle-26e5f.firebasestorage.app",messagingSenderId:"222166881414",appId:"1:222166881414:web:2cc76b78b00cb40f7d6d07"});const auth=firebase.auth(),db=firebase.firestore();
const head='<h1>AREXA ADMIN</h1><div class="tag">OWNER / SUB-ADMIN PANEL</div>';
function login(){$.innerHTML=head+`<div class="card"><input id="e" type="email" placeholder="Admin email"><input id="p" type="password" placeholder="Password"><div class="err">${err}</div><button onclick="go()">ADMIN LOGIN</button></div>`}
async function go(){const e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;err='';try{await auth.signInWithEmailAndPassword(e,p)}catch(x){err=x.message;login()}}
async function check(u){let a;try{a=await db.doc('admins/'+u.uid).get()}catch(x){}
if(!a||!a.exists||a.data().active===false){await auth.signOut();err='Admin access nahi hai';return login()}
$.innerHTML=head+`<div class="card"><div class="big">${a.data().role}</div>${u.email}</div><div class="card off">Players, Tournaments, Sub-Admins, Coins, Reports: Phase 3 me</div><button onclick="auth.signOut()">LOGOUT</button>`}
auth.onAuthStateChanged(u=>u?check(u):login());
</script></body></html>
